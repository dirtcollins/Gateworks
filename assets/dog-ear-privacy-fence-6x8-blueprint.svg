      .ghost { fill: none; stroke: #5c8caf; stroke-width: 2; stroke-dasharray: 12 10; stroke-linecap: round; }
      .dim { fill: none; stroke: #174d7c; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
