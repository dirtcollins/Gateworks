<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">6 ft by 8 ft Dog Ear Privacy Fence Panel - Blueprint Style Vector</title>
  <desc id="desc">Professional line-art elevation drawing of a standard dog-ear privacy fence panel with dimensions, rails, pickets, nail placement, and construction callouts.</desc>
